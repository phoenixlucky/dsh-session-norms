# Bundle patch layer: the row loads the package's main entry as the Host half
# (a plain Cordis plugin that publishes the normalized transcript projection);
# the `dsh.client` declaration makes the Web app load ./client.js as the
# browser half that registers the "Normative view" conversation view.
- insert:
    - id: tinyforge-session-norms
      name: '@tinyforge/dsh-session-norms'
